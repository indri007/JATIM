[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batas-evaluation"
version = "0.1.0"
description = "Bounded Agent Trust and Authority Scoping (BATAS): A Zero Trust Architecture for Agentic AI in Regional Banking"
authors = [{ name = "Indri Anjar Kartika Sari", email = "indri.cs2026@ids.ac.id" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]
